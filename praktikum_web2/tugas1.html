<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pancasila</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .pancasila-table {
            width: 700px;
            margin: 0 auto;
            border-collapse: collapse;
        }

        .pancasila-table td {
            padding: 15px;
            vertical-align: middle;
            font-size: 18px;
            font-weight: bold;
        }

        .col-left {
            width: 50%;
            text-align: right;
        }

        .col-right {
            width: 50%;
            text-align: left;
        }

        .img-box {
            width: 110px;
            height: 110px;
            object-fit: contain;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>PANCASILA</h1>

    <table class="pancasila-table">
        <!-- SILA 1 -->
        <tr>
            <td class="col-left">
                <img src="bintang.jpg" alt="Bintang" class="img-box">
            </td>
            <td class="col-right">
                Ketuhanan Yang Maha Esa
            </td>
        </tr>

        <!-- SILA 2 -->
        <tr>
            <td class="col-left">
                Kemanusiaan Yang Adil dan Beradab
            </td>
            <td class="col-right">
                <img src="rantai.png" alt="Rantai" class="img-box">
            </td>
        </tr>

        <!-- SILA 3 -->
        <tr>
            <td class="col-left">
                <img src="pohon beringin.webp" alt="Pohon Beringin" class="img-box">
            </td>
            <td class="col-right">
                Persatuan Indonesia
            </td>
        </tr>

        <!-- SILA 4 -->
        <tr>
            <td class="col-left">
                Kerakyatan yang dipimpin oleh hikmat kebijaksanaan<br>dalam permusyawaratan perwakilan
            </td>
            <td class="col-right">
                <img src="kepala banteng.webp" alt="Kepala Banteng" class="img-box">
            </td>
        </tr>

        <!-- SILA 5 -->
        <tr>
            <td class="col-left">
                <img src="Padi Kapas.png" alt="Padi dan Kapas" class="img-box">
            </td>
            <td class="col-right">
                Keadilan sosial bagi seluruh rakyat Indonesia
            </td>
        </tr>
    </table>

</body>
</html>
