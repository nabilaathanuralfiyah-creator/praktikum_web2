<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tabel Presensi Siswa</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            color: #000;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .text-left {
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th rowspan="3">NIS</th>
                <th rowspan="3">Nama</th>
                <th colspan="9">Bulan</th>
            </tr>
            <tr>
                <th colspan="3">Januari</th>
                <th colspan="3">Februari</th>
                <th colspan="3">Maret</th>
            </tr>
            <tr>
                <th>S</th>
                <th>I</th>
                <th>A</th>
                <th>S</th>
                <th>I</th>
                <th>A</th>
                <th>S</th>
                <th>I</th>
                <th>A</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>111</td>
                <td class="text-left">Zulkarnaen</td>
                <td>0</td>
                <td>2</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>1</td>
                <td>0</td>
            </tr>
            <tr>
                <td>112</td>
                <td class="text-left">Zulkifli</td>
                <td>1</td>
                <td>0</td>
                <td>2</td>
                <td>1</td>
                <td>9</td>
                <td>0</td>
                <td>2</td>
                <td>0</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
